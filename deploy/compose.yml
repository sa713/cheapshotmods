services:
  app:
    image: ${CHM_APP_IMAGE:?}
    pull_policy: never
    env_file:
      - path: ${CHM_CONFIG_FILE:?}
        format: raw
    environment:
      DATABASE_PATH: /data/cheapshot.sqlite
      PORT: "3000"
      TRUST_PROXY: "1"
    volumes:
      - database:/data
    restart: unless-stopped
    networks: [private]
  proxy:
    image: ${CHM_PROXY_IMAGE:?}
    pull_policy: never
    environment:
      CHM_DOMAIN: ${CHM_DOMAIN:?}
      CADDY_EMAIL: ${CADDY_EMAIL:-}
    ports:
      - ${CHM_BIND_ADDRESS:-0.0.0.0}:${CHM_HTTP_PORT:-80}:80
      - ${CHM_BIND_ADDRESS:-0.0.0.0}:${CHM_HTTPS_PORT:-443}:443
    volumes:
      - ${CHM_CADDYFILE:?}:/etc/caddy/Caddyfile:ro
      - proxy_data:/data
      - proxy_config:/config
    restart: unless-stopped
    depends_on: [app]
    networks: [private]
networks:
  private: {}
volumes:
  database:
    external: true
    name: ${CHM_DATA_VOLUME:?}
  proxy_data: {}
  proxy_config: {}
