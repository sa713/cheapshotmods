# Copy to .github/workflows/verify.yml in a product after creating scripts/verify.sh.
# The product script installs pinned dependencies, then runs real checks/builds.
# Adapt branch/runner to the product; this workflow performs no deployment.
name: Verify product
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Verify pinned source
        shell: bash
        run: |
          set -euo pipefail
          test -f scripts/verify.sh
          bash scripts/verify.sh
